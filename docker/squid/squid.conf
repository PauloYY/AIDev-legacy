# Proxy egress do sandbox do AIDev — usado apenas quando
# AIDEV_SANDBOX_NETWORK_MODE=restricted.
#
# Objetivo: o container do sandbox roda numa rede Docker "--internal"
# (sem rota nenhuma pra internet). O único jeito dele alcançar QUALQUER
# coisa fora é através deste proxy — e este proxy só encaminha tráfego
# pros domínios abaixo. Tudo mais é bloqueado (deny all no final).
#
# Se algum runtime/gerenciador de pacote precisar de mais um domínio,
# adicione uma linha nova em "allowed_domains" e reconstrua a imagem
# (docker build -t aidev-sandbox-proxy:latest docker/squid).

http_port 3128

# --- Registries de pacotes liberados ---
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .yarnpkg.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain .proxy.golang.org
acl allowed_domains dstdomain .sum.golang.org
acl allowed_domains dstdomain .storage.googleapis.com
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .static.crates.io
acl allowed_domains dstdomain .repo.maven.apache.org
acl allowed_domains dstdomain .repo1.maven.org
acl allowed_domains dstdomain .rubygems.org
acl allowed_domains dstdomain .packagist.org
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .objects.githubusercontent.com

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Regras de segurança padrão do Squid.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Só libera o que está na allowlist. Tudo o mais cai no "deny all".
http_access allow allowed_domains
http_access deny all

visible_hostname aidev-sandbox-proxy

# Menos verboso — isso roda o tempo todo em segundo plano.
access_log stdio:/var/log/squid/access.log